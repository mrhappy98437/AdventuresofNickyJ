<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 90" width="60" height="90">
  <defs>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="140%">
      <feDropShadow dx="3" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <!-- Outer black stroke (gives illustrated outline feel) -->
  <polygon points="52,6 8,45 52,84"
    fill="white"
    stroke="#1a0a10"
    stroke-width="5"
    stroke-linejoin="round"
    filter="url(#shadow)"/>
</svg>
